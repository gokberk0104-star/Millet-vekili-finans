
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Millet Vekili Finans</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body {
  background:#101827;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:25px;
}
.panel {
  background:#1d293b;
  padding:25px;
  margin-top:60px;
  border-radius:18px;
}
button {
  width:100%;
  padding:16px;
  background:#16a085;
  color:white;
  border:0;
  border-radius:12px;
  font-size:17px;
}
#address {
  overflow-wrap:anywhere;
}
</style>
</head>
<body>

<div class="panel">
<h2>🏛️ MİLLET VEKİLİ FİNANS</h2>
<p>TRON cüzdanını bağla</p>
<button onclick="connectWallet()">TronLink Cüzdanımı Bağla</button>
<p id="status">Cüzdan bağlanmadı.</p>
<p id="address"></p>
</div>

<script>
if (window.Telegram?.WebApp) {
  window.Telegram.WebApp.ready();
}

let tronProvider = window.tron || null;

window.addEventListener("TIP6963:announceProvider", function(e) {
  if (e.detail?.info?.name === "TronLink") {
    tronProvider = e.detail.provider;
  }
});

window.dispatchEvent(new Event("TIP6963:requestProvider"));

async function connectWallet() {
  const status = document.getElementById("status");
  const address = document.getElementById("address");

  address.textContent = "";
  status.textContent = "Cüzdan aranıyor...";

  try {
    if (!tronProvider) {
      throw new Error("TronLink bulunamadı. TronLink DApp tarayıcısından aç.");
    }

    const accounts = await tronProvider.request({
      method: "eth_requestAccounts"
    });

    if (!accounts || !accounts[0]) {
      throw new Error("Cüzdan bağlantısı onaylanmadı.");
    }

    status.textContent = "Cüzdan başarıyla bağlandı!";
    address.textContent = "Adres: " + accounts[0];

  } catch (error) {
    status.textContent = error.message || "Bağlantı başarısız.";
  }
}
</script>

</body>
</html>
